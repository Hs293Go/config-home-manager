# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
# Reference: https://sw.kovidgoyal.net/kitty/conf/

## Fonts ##
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# font_size 12.0
disable_ligatures never

## Cursor ##
cursor_shape         beam
cursor_blink_interval 0.5
cursor_trail         3
cursor_trail_decay   0.1 0.4

## Scrollback ##
scrollback_lines             10000
scrollback_pager             less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 64

## Mouse ##
mouse_hide_wait        -1
detect_urls            yes
url_style              curly
copy_on_select         no
strip_trailing_spaces  smart
focus_follows_mouse    no

## Performance ##
sync_to_monitor yes

## Bell ##
enable_audio_bell    yes
visual_bell_duration 0.0
bell_on_tab          "🔔 "

## Window layout ##
remember_window_size   no
initial_window_width   88c
initial_window_height  24c
enabled_layouts        splits,grid,stack
window_padding_width   2
hide_window_decorations no
confirm_os_window_close 0

## Tab bar ##
tab_bar_edge       top
tab_bar_style      powerline
tab_powerline_style slanted
tab_activity_symbol •
tab_title_template "{index}: {title}{' ' + activity_symbol if activity_symbol else ''}"

## Color scheme ##
background         #171a1b
background_opacity 0.92

## Advanced ##
allow_remote_control yes
listen_on            unix:/tmp/kitty-{kitty_pid}
shell_integration    enabled
clipboard_control    write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_hyperlinks     yes
update_check_interval 0
notify_on_cmd_finish unfocused 5.0
paste_actions        quote-urls-at-prompt,confirm

## OS-specific ##
linux_display_server auto

## Keybindings ##
kitty_mod ctrl+super

# Clipboard
map ctrl+shift+c copy_to_clipboard
map kitty_mod+c  copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map kitty_mod+v  paste_from_clipboard

# Scrolling
map kitty_mod+k         scroll_line_up
map kitty_mod+j         scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+h         show_scrollback
# shell-integration jumps (needs zsh integration enabled above)
map kitty_mod+[         scroll_to_prompt -1
map kitty_mod+]         scroll_to_prompt  1
map kitty_mod+z         scroll_to_prompt  0
map kitty_mod+g         show_last_command_output

# Window splits & navigation (splits layout)
map alt+s launch --location=vsplit --cwd=current
map alt+v launch --location=hsplit --cwd=current
map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right
map alt+x close_window
map alt+f move_window_forward
map alt+b move_window_backward
map alt+` move_window_to_top
map alt+r start_resizing_window
map alt+1 first_window
map alt+2 second_window
map alt+3 third_window
map alt+4 fourth_window
map alt+5 fifth_window
map alt+6 sixth_window
map alt+7 seventh_window
map alt+8 eighth_window
map alt+9 ninth_window
map alt+0 tenth_window

# Tabs
map kitty_mod+t        new_tab_with_cwd
map ctrl+shift+t       new_tab_with_cwd
map kitty_mod+w        close_tab
map kitty_mod+page_up   move_tab_forward
map kitty_mod+page_down move_tab_backward
map kitty_mod+alt+t    set_tab_title
map ctrl+page_down     next_tab
map ctrl+page_up       previous_tab
map alt+shift+l        next_tab
map alt+shift+h        previous_tab

# Layouts
map kitty_mod+= goto_layout grid
map kitty_mod+- goto_layout splits
map kitty_mod+0 goto_layout stack
map kitty_mod+l next_layout

# Font sizes
map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# Hints kitten — chord under kitty_mod+e + single-mod fallbacks
map kitty_mod+e>u kitten hints
map kitty_mod+e>p kitten hints --type path --program -
map kitty_mod+e>P kitten hints --type path
map kitty_mod+e>l kitten hints --type line --program -
map kitty_mod+e>w kitten hints --type word --program -
map kitty_mod+e>h kitten hints --type hash --program -
map alt+e         kitten hints
map alt+p         kitten hints --type path --program -

# Misc
map kitty_mod+f5     load_config_file
map kitty_mod+f11    toggle_fullscreen
map kitty_mod+f10    toggle_maximized
map kitty_mod+u      kitten unicode_input
map kitty_mod+f2     edit_config_file
map kitty_mod+escape kitty_shell window
map kitty_mod+delete clear_terminal reset active
