# ROS 2 Humble on Ubuntu 22.04, mirroring the Z690 desktop's apt setup.
#
#   distrobox assemble create --file ~/.config/distrobox/ros-humble.ini
#   distrobox enter ros-humble
#
# Recreate from scratch: add --replace to the create command.
[ros-humble]
image=docker.io/library/ubuntu:22.04
pull=true
init=false
start_now=false
# /nix is mounted by nixpkgs' distrobox.conf, so home-manager's ~/.zshrc and
# dotfiles (symlinks into /nix/store) work inside the container.
# GPU via the CDI spec from hardware.nvidia-container-toolkit (distrobox's
# own --nvidia flag looks for driver libs in FHS paths NixOS doesn't have).
additional_flags="--device nvidia.com/gpu=all"
additional_packages="git curl gnupg lsb-release locales software-properties-common"
# Runs as root on first `distrobox enter`; safe to re-run by hand with
#   distrobox enter ros-humble -- sudo bash ~/.config/distrobox/ros-humble-setup.sh
init_hooks="bash /home/hs293go/.config/distrobox/ros-humble-setup.sh"
